<script src="lib/jquery-1.12.4.min.js"></script>
<form id="form1" runat="server">
<input type="hidden" id="zonecode">
<input type="hidden" id="address" >
<div id="layer" style="display:none;border:0px solid;position:fixed;width:600px;height:600px;left:0%;margin-left:0px;top:0%;margin-top:0px;overflow:hidden;-webkit-overflow-scrolling:touch;">
<img src="//i1.daumcdn.net/localimg/localimages/07/postcode/320/close.png" id="btnCloseLayer" style="cursor:pointer;position:absolute;right:-3px;top:-3px" onclick="closeDaumPostcode()">
</div>
<script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
var element=document.getElementById('layer');
function closeDaumPostcode(){
element.style.display='none';
}
function showDaumPostcode(){
new daum.Postcode({
oncomplete: function(data){
var fullAddr='';
var extraAddr='';
if(data.userLanguageType=='K'){
if(data.userSelectedType=='R'){
fullAddr=data.roadAddress;
if(data.bname!=''){
extraAddr+=data.bname;
}
if(data.buildingName!=''){
extraAddr+=(extraAddr != '' ? ', ' + data.buildingName : data.buildingName);
}
fullAddr+=(extraAddr != '' ? ' ('+ extraAddr +')' : '');
}else{ 
fullAddr=data.jibunAddress;
if(data.buildingName!=''){
extraAddr+=(extraAddr != '' ? ', ' + data.buildingName : data.buildingName);
}
fullAddr+=(extraAddr != '' ? ' '+ extraAddr : '');
}
}else{
if(data.userSelectedType=='R'){
fullAddr=data.roadAddressEnglish;
}else{
fullAddr=data.jibunAddressEnglish;
}
}
document.getElementById('zonecode').value=data.zonecode;
document.getElementById('address').value=fullAddr;
element.style.display='none';
var url="?zonecode="+data.zonecode+"&address="+fullAddr
$(location).attr('href',url);
},
width:'100%',
height:'100%'
}).embed(element);
element.style.display='block';
}
</script>
<script>
showDaumPostcode();
</script>
