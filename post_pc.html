<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

#layer{
    display:none;
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    overflow:hidden;
}
</style>

</head>

<body>

<input type="hidden" id="zonecode">
<input type="hidden" id="address">

<div id="layer">
    <img src="//i1.daumcdn.net/localimg/localimages/07/postcode/320/close.png"
         id="btnCloseLayer"
         style="cursor:pointer;position:absolute;right:5px;top:5px;z-index:1;"
         onclick="closeDaumPostcode();">

</div>

<script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

<script>

var element = document.getElementById("layer");

function closeDaumPostcode(){
    element.style.display="none";

    // 취소했음을 PowerBuilder에 전달
    document.title="CANCEL";
}

function showDaumPostcode(){

    new daum.Postcode({

        oncomplete:function(data){

            var fullAddr="";
            var extraAddr="";

            if(data.userLanguageType=="K"){

                if(data.userSelectedType=="R"){

                    fullAddr=data.roadAddress;

                    if(data.bname!="")
                        extraAddr+=data.bname;

                    if(data.buildingName!="")
                        extraAddr+=(extraAddr!="" ? ", " : "") + data.buildingName;

                    if(extraAddr!="")
                        fullAddr+=" ("+extraAddr+")";

                }else{

                    fullAddr=data.jibunAddress;

                    if(data.buildingName!="")
                        extraAddr=data.buildingName;

                    if(extraAddr!="")
                        fullAddr+=" "+extraAddr;
                }

            }else{

                if(data.userSelectedType=="R")
                    fullAddr=data.roadAddressEnglish;
                else
                    fullAddr=data.jibunAddressEnglish;

            }

            document.getElementById("zonecode").value=data.zonecode;
            document.getElementById("address").value=fullAddr;

            element.style.display="none";

            //--------------------------------------------------
            // PowerBuilder에서 읽을 값
            //--------------------------------------------------
            document.title =
                data.zonecode + "|" +
                encodeURIComponent(fullAddr);

        },

        width:"100%",
        height:"100%"

    }).embed(element);

    element.style.display="block";
}

showDaumPostcode();

</script>

</body>
</html>
