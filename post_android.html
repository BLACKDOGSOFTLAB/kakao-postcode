<!DOCTYPE html>
<html>
<head>
</head>
<body>
<div id="layer" style="display:block;position:fixed;overflow:hidden;z-index:1;-webkit-overflow-scrolling:touch;">
</div>

<script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

<script>
	window.addEventListener("message", onReceivedPostMessage, false);

	function onReceivedPostMessage(event){
		var action = event.data.action;
		var params = event.data.params;
	}

	function onReceivedActivityMessageViaJavascriptInterface(json){
		var data = JSON.parse(json);
		var action = data.action;
		var params = data.params;
	}

    var element_layer = document.getElementById('layer');

    function showDaumPostcode() {
        new daum.Postcode({
            oncomplete: function(data) {

                var fullAddr = '';
				var extraAddr = '';

				if(data.userLanguageType == 'K') {

	                if (data.userSelectedType == 'R') { 
	                    fullAddr = data.roadAddress;

	                    if(data.bname != ''){
	                        extraAddr += data.bname;
	                    }

	                    if(data.buildingName != ''){
	                        extraAddr += (extraAddr != '' ? ', ' + data.buildingName : data.buildingName);
	                    }

	                    fullAddr += (extraAddr != '' ? ' ('+ extraAddr +')' : '');
	                    
	                } else { 
	                    fullAddr = data.jibunAddress;

	                    if(data.buildingName != ''){
	                        extraAddr += (extraAddr != '' ? ', ' + data.buildingName : data.buildingName);
	                    }
	                    
	                    fullAddr += (extraAddr != '' ? ' '+ extraAddr : '');
	                }

                } else {
	                if (data.userSelectedType == 'R') { 
						fullAddr = data.roadAddressEnglish;
	                } else {
						fullAddr = data.jibunAddressEnglish;
	                }
                }			

				window.Android.selectPost(data.zonecode, fullAddr);
            },
            width : '100%',
            height : '100%'
        }).embed(element_layer);

        element_layer.style.display = 'block';

        initLayerPosition();
    }

    function initLayerPosition()
    {
        var width = (window.innerWidth || document.documentElement.clientWidth);
        var height = (window.innerHeight || document.documentElement.clientHeight);
        var borderWidth = 0;

        element_layer.style.width = width + 'px';
        element_layer.style.height = height + 'px';
        element_layer.style.border = borderWidth + 'px solid';

        element_layer.style.left = (((window.innerWidth || document.documentElement.clientWidth) - width)/2 - borderWidth) + 'px';
        element_layer.style.top = (((window.innerHeight || document.documentElement.clientHeight) - height)/2 - borderWidth) + 'px';
    }
</script>

</body>
</html>
